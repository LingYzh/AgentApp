<!doctype html><html lang="zh-CN" data-theme="light"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"><meta name="color-scheme" content="light dark"><title>AgentApp · UI 原型 v2</title><style>

:root{--bg:#FAF9F5;--surface:#FFFFFF;--soft:#F1EFE8;--hover:#EAE7DE;--ink:#262624;--muted:#6B6860;--line:#E4E1D7;--accent:#A34F36;--accentSeed:#D97757;--accentSoft:#F5E7DF;--success:#526447;--successSoft:#EAF0E5;--danger:#A33732;--dangerSoft:#F7E7E4;--blue:#456882;--code:#EEECE5;--scrim:rgba(28,27,25,.32);--shadow:0 6px 24px rgba(48,43,34,.06);--radius:18px;--font:ui-sans-serif,-apple-system,BlinkMacSystemFont,"Segoe UI","Noto Sans CJK SC","Microsoft YaHei",sans-serif;--serif:Georgia,"Noto Serif CJK SC","Songti SC",serif}

[data-theme=dark]{--bg:#262624;--surface:#30302D;--soft:#353530;--hover:#41413A;--ink:#F1F0E9;--muted:#B6B3AA;--line:#46463F;--accent:#E6A086;--accentSeed:#D97757;--accentSoft:#49392F;--success:#ABC399;--successSoft:#333D2F;--danger:#ECA29B;--dangerSoft:#493431;--blue:#A5C4DE;--code:#20201E;--scrim:rgba(0,0,0,.48);--shadow:none}

*{box-sizing:border-box}
body{margin:0;background:#EDEAE2;color:#262624;font-family:var(--font);font-size:14px}
button,input,textarea,select{font:inherit}
button{cursor:pointer;-webkit-tap-highlight-color:transparent}
button{color:inherit}
button:disabled{cursor:not-allowed;opacity:.42}
button:focus-visible,input:focus-visible,textarea:focus-visible,select:focus-visible,summary:focus-visible{outline:2px solid var(--accent);outline-offset:3px}
button{border:0;background:none}
svg{width:21px;height:21px;flex:none;fill:none;stroke:currentColor;stroke-width:1.65;stroke-linecap:round;stroke-linejoin:round}
h1,h2,h3,p{margin:0}
p{line-height:1.8}
small{font-size:12px}
input,textarea,select{color:var(--ink);background:var(--surface)}
input::placeholder,textarea::placeholder{color:var(--muted);opacity:.82}
a{color:var(--accent)}
.mono,code,pre{font-family:ui-monospace,SFMono-Regular,Consolas,monospace}
.muted{color:var(--muted)}
.accent{color:var(--accent)}
.success{color:var(--success)}
.danger{color:var(--danger)}
.nowrap{white-space:nowrap}
.stretch{flex:1;min-width:0}
.row{display:flex;align-items:center;gap:12px}
.between{justify-content:space-between}
.gap6{gap:6px}
.column{display:flex;flex-direction:column;gap:12px}
.mt8{margin-top:8px}
.mt16{margin-top:16px}
.mt24{margin-top:24px}
.mb16{margin-bottom:16px}
.wrap{flex-wrap:wrap}
.full{width:100%}
.hidden{display:none!important}
.text-left{text-align:left}
.label{font-size:12px;letter-spacing:.06em;font-weight:600;color:var(--muted)}
.review-header{height:83px;padding:0 38px;border-bottom:1px solid #DCD8CC;display:flex;align-items:center;justify-content:space-between}
.review-brand{display:flex;align-items:center;gap:14px}
.review-brand strong{font-size:19px;letter-spacing:-.6px}
.review-brand span{font-size:11px;letter-spacing:.15em;margin-left:10px;color:#787366}
.review-header p{font-size:12px;color:#787366}
.review-actions{display:flex;gap:8px;align-items:center}
.review-btn{background:#F8F6F0;border:1px solid #D7D2C5;border-radius:9px;padding:9px 13px;min-height:38px;font-size:12px}
.review-btn.active{background:#37362F;color:#FAF9F5}
.review-layout{display:grid;grid-template-columns:232px minmax(440px,1fr) 278px;max-width:1540px;margin:auto;height:calc(100vh - 83px)}
.review-nav{padding:25px 20px 28px 30px;overflow-y:auto;scrollbar-width:thin}
.review-group{font-size:10px;letter-spacing:.13em;color:#8B867A;margin:23px 10px 9px}
.review-group:first-child{margin-top:0}
.review-item{width:100%;display:flex;align-items:center;text-align:left;gap:10px;border-radius:8px;min-height:36px;padding:6px 10px;color:#666155;font-size:12px}
.review-item .num{font-size:10px;opacity:.65;font-family:monospace;width:22px}
.review-item.active{background:#E2DBCD;color:#43372C}
.review-item:hover{background:#E7E2D7}
.stage{display:flex;align-items:center;justify-content:flex-start;flex-direction:column;padding:24px 0 16px;overflow:auto;background:radial-gradient(ellipse at 50% 40%,#F8F6F0,transparent 70%)}
.phone{width:412px;height:min(868px,calc(100vh - 152px));min-height:620px;background:var(--bg);color:var(--ink);border:1px solid #C9C4B8;border-radius:32px;position:relative;box-shadow:0 24px 60px -28px #58504466,0 1px 4px #58504411;overflow:hidden;display:flex;flex-direction:column;flex:none}
.phone.compact{width:360px}
.statusbar{height:30px;display:flex;align-items:center;justify-content:space-between;padding:8px 24px 0;font-size:11px;font-weight:650;flex:none;background:var(--bg);color:var(--ink)}
.status-icons{display:flex;align-items:center;gap:5px}
.status-icons svg{width:13px;height:13px;stroke-width:2}
.phone-content{display:flex;flex-direction:column;min-height:0;flex:1;position:relative}
.android-bar{height:22px;display:flex;align-items:center;justify-content:center;flex:none;background:var(--bg)}
.android-bar span{width:105px;height:4px;background:var(--ink);opacity:.8;border-radius:9px}
.stage-caption{font-size:11px;color:#817B6C;margin-top:15px;letter-spacing:.07em}
.review-info{padding:31px 28px 24px 16px;overflow:auto}
.review-info h2{font-family:var(--serif);font-weight:500;font-size:25px;line-height:1.6;margin:13px 0}
.review-info p{font-size:12px;color:#706B60;line-height:1.9;margin:9px 0}
.review-info .rule{height:1px;background:#D8D3C7;margin:25px 0}
.review-info .eyebrow{font-size:10px;letter-spacing:.17em;color:#9D523B}
.review-info code{font-size:10px;overflow-wrap:anywhere;background:#E5E0D4;padding:2px 5px;border-radius:3px}
.swatches{display:flex;gap:7px;margin-top:12px}
.swatch{width:30px;height:30px;border-radius:50%;border:1px solid #00000010}
.review-note{background:#E6DFD1;border-radius:12px;padding:12px 14px;font-size:11px!important;line-height:1.8!important;margin-top:21px!important}
.topbar{height:64px;min-height:64px;display:flex;align-items:center;padding:4px 12px;gap:3px;position:relative;z-index:1;background:var(--bg)}
.topbar .heading{font-size:17px;font-weight:600;flex:1;min-width:0;margin-left:5px;letter-spacing:-.35px}
.topbar .heading span{display:block;font-size:11px;font-weight:400;color:var(--muted);margin-top:3px;letter-spacing:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.topbar .title-btn{padding:0;text-align:left}
.topbar .title-btn strong{font-size:16px;font-weight:550}
.topbar .title-btn small{display:flex;align-items:center;gap:4px;color:var(--muted);font-size:11px;margin-top:3px}
.topbar .title-btn small svg{width:12px;height:12px}
.icon-btn{height:48px;width:48px;min-width:48px;display:inline-flex;align-items:center;justify-content:center;border-radius:50%;color:var(--ink)}
.icon-btn:hover{background:var(--soft)}
.icon-btn svg{width:22px;height:22px}
.text-btn{min-height:48px;padding:8px 12px;border-radius:10px;font-size:13px;color:var(--accent);font-weight:550}
.text-btn:hover{background:var(--accentSoft)}
.btn{min-height:48px;padding:12px 18px;border-radius:13px;display:inline-flex;align-items:center;justify-content:center;gap:8px;line-height:1.3;font-size:14px;font-weight:550;border:1px solid var(--line);background:var(--surface)}
.btn.primary{background:var(--accent);color:var(--bg);border-color:var(--accent)}
.btn.ink{background:var(--ink);border-color:var(--ink);color:var(--bg)}
.btn.ghost{background:transparent}
.btn.destructive{background:var(--danger);color:var(--bg);border-color:var(--danger)}
.btn.small{font-size:12px;padding:8px 12px;min-height:40px}
.btn:hover{filter:brightness(.97)}
.content{overflow-y:auto;overflow-x:hidden;flex:1;min-height:0;padding:6px 22px 24px;scrollbar-width:thin;scrollbar-color:var(--line) transparent;overscroll-behavior:contain}
.content.flush{padding:0 16px 20px}
.page-intro{padding:10px 2px 22px}
.page-intro h1{font-size:28px;font-family:var(--serif);font-weight:500;letter-spacing:-1px;line-height:1.6}
.page-intro p{font-size:12px;color:var(--muted);line-height:1.8;margin-top:7px}
.home-main{display:flex;flex-direction:column;justify-content:center;align-items:flex-start;padding:10px 28px 20px;flex:1;min-height:0;overflow:auto}
.mark{display:block;width:44px;height:44px;color:var(--accentSeed)}
.mark svg{width:100%;height:100%;stroke-width:1.7}
.home-main h1{font-family:var(--serif);font-size:32px;line-height:1.65;font-weight:500;letter-spacing:-1.1px;margin:25px 0 11px}
.home-main p{color:var(--muted);font-size:13px;line-height:1.9;max-width:310px}
.suggestions{display:flex;flex-wrap:wrap;gap:8px;margin-top:26px}
.suggestion{border:1px solid var(--line);background:transparent;border-radius:12px;padding:11px 13px;min-height:46px;display:flex;align-items:center;gap:9px;font-size:12px}
.suggestion svg{width:17px;height:17px;color:var(--muted)}
.suggestion:hover{background:var(--soft)}
.home-footer-label{font-size:11px;color:var(--muted);padding:0 28px 9px}
.composer-wrap{padding:0 14px 3px;background:var(--bg);flex:none}
.composer{border:1px solid var(--line);border-radius:23px;background:var(--surface);box-shadow:var(--shadow);padding:13px 10px 6px}
.composer:focus-within{border-color:var(--accent)}
.composer textarea{resize:none;background:none;outline:none!important;border:0;width:100%;min-height:43px;max-height:120px;padding:1px 7px;line-height:1.6;font-size:15px}
.composer textarea:focus-visible{outline:none}
.composer-footer{display:flex;justify-content:space-between;align-items:center;gap:4px}
.composer .send{background:var(--accent);color:var(--bg);border-radius:50%;width:39px;height:39px;min-width:39px;box-shadow:0 0 0 4px var(--surface);margin:4px}
.composer .send svg{width:20px;height:20px;stroke-width:2}
.composer .send:disabled{background:var(--soft);color:var(--muted);opacity:1}
.composer-tools{display:flex;align-items:center;gap:0}
.composer-tools .text-btn{font-size:11px;padding:6px 8px;color:var(--muted)}
.control-strip{display:flex;align-items:center;gap:2px;justify-content:space-between;min-height:44px;padding:0 5px}
.control-strip button{display:flex;align-items:center;gap:5px;font-size:10px;padding:9px 4px;min-height:44px;white-space:nowrap;color:var(--muted)}
.control-strip button svg{width:14px;height:14px}
.control-strip .context-indicator{width:12px;height:12px;border-radius:50%;border:2px solid var(--line);border-top-color:var(--accent);transform:rotate(30deg)}
.inline-note{font-size:11px;line-height:1.7;color:var(--muted);padding:8px 2px}
.chat-scroll{padding:6px 22px 24px}
.user-message{max-width:89%;margin:13px 0 26px auto;background:var(--soft);border-radius:20px 20px 5px 20px;padding:14px 17px;font-size:14px;line-height:1.85;white-space:pre-wrap;overflow-wrap:anywhere}
.user-file{display:flex;gap:8px;align-items:center;margin-top:10px;padding-top:10px;border-top:1px solid var(--line);font-size:11px;color:var(--muted)}
.assistant-message{font-size:14px;line-height:1.95}
.assistant-message p{line-height:1.95;margin-bottom:15px}
.assistant-message h3{font-size:17px;margin:20px 0 9px;font-weight:600}
.assistant-meta{font-size:11px;color:var(--muted);margin:0 0 12px;display:flex;align-items:center;gap:7px}
.mini-mark{color:var(--accent);display:inline-flex}
.mini-mark svg{width:20px;height:20px}
.thinking-line{font-size:11px;color:var(--muted);display:flex;align-items:center;gap:6px;margin-bottom:12px;min-height:32px;padding:0}
.thinking-line svg{width:14px;height:14px}
.activity{border:1px solid var(--line);border-radius:14px;overflow:hidden;margin:13px 0 20px;background:var(--bg)}
.activity summary{padding:12px 13px;display:flex;align-items:center;gap:9px;cursor:pointer;min-height:49px;font-size:12px;list-style:none}
.activity summary::-webkit-details-marker{display:none}
.activity summary>.stretch{font-weight:500}
.activity summary svg{width:17px;height:17px}
.activity summary .chev{width:13px;height:13px;transition:transform .18s}
.activity[open] summary .chev{transform:rotate(180deg)}
.activity-body{padding:2px 14px 13px;font-size:11px;color:var(--muted);line-height:1.8}
.timeline{border-left:1px solid var(--line);margin-left:6px;padding-left:18px}
.timeline-item{position:relative;padding:9px 0}
.timeline-item:before{content:'';position:absolute;left:-22px;top:18px;width:7px;height:7px;border-radius:50%;background:var(--success);box-shadow:0 0 0 4px var(--bg)}
.timeline-item.running:before{background:var(--accent);animation:pulse 1.6s infinite}
.timeline-item strong{font-size:12px;font-weight:500;color:var(--ink)}
.artifact{width:100%;display:flex;align-items:center;gap:12px;background:var(--surface);border:1px solid var(--line);border-radius:15px;padding:15px 14px;text-align:left;min-height:78px;margin:15px 0;box-shadow:var(--shadow)}
.file-icon{width:41px;height:47px;flex:none;display:flex;align-items:center;justify-content:center;border-radius:7px;background:var(--soft);color:var(--accent)}
.file-icon svg{width:24px;height:24px}
.artifact strong{font-size:13px;font-weight:550;display:block}
.artifact small{font-size:10px;display:block;color:var(--muted);margin-top:5px}
.artifact>svg{width:16px;height:16px;color:var(--muted)}
.message-actions{display:flex;gap:1px;align-items:center;margin:8px 0}
.message-actions .icon-btn{width:42px;height:44px;min-width:42px;color:var(--muted)}
.message-actions svg{width:16px;height:16px}
.message-actions .meta{font-size:10px;color:var(--muted);margin-left:auto}
.bullets{margin:10px 0 18px;padding-left:20px;line-height:1.95}
.bullets li{margin:7px 0;padding-left:3px}
.task-status{display:flex;gap:9px;align-items:center;padding:10px 14px;margin:3px 0 12px;border-radius:12px;background:var(--soft);font-size:12px}
.spinner{display:inline-block;width:14px;height:14px;border:1.6px solid var(--line);border-top-color:var(--accent);border-radius:50%;animation:spin 1s linear infinite;flex:none}
.dot{width:6px;height:6px;border-radius:50%;background:var(--success);display:inline-block;flex:none}
.dot.running{background:var(--accent);animation:pulse 1.5s infinite}
.notice{padding:12px 14px;border-radius:12px;font-size:12px;line-height:1.85;background:var(--soft);color:var(--muted);border:1px solid transparent}
.notice.warning{background:var(--accentSoft);color:var(--accent)}
.notice.error{background:var(--dangerSoft);color:var(--danger)}
.notice.good{background:var(--successSoft);color:var(--success)}
.notice strong{font-weight:600}
.section-title{font-size:11px;color:var(--muted);font-weight:550;letter-spacing:.06em;margin:23px 2px 11px;display:flex;justify-content:space-between;align-items:center}
.searchbox{display:flex;align-items:center;gap:9px;border-radius:12px;background:var(--soft);padding:0 13px;min-height:45px;color:var(--muted);margin:4px 0 18px}
.searchbox input{flex:1;border:0;outline:0!important;background:none;min-width:0;height:44px;font-size:13px}
.searchbox svg{width:18px;height:18px}
.list-row{width:100%;text-align:left;padding:16px 7px;min-height:76px;display:flex;align-items:center;gap:13px;border-bottom:1px solid var(--line)}
.list-row:last-child{border-bottom:0}
.list-row strong{font-size:14px;font-weight:550;line-height:1.5;display:block}
.list-row p{font-size:11px;color:var(--muted);line-height:1.7;margin-top:5px}
.list-row>svg:last-child{width:16px;color:var(--muted)}
.list-row:hover{background:var(--soft);border-radius:10px}
.row-icon{display:flex;align-items:center;justify-content:center;width:42px;height:42px;border-radius:12px;background:var(--soft);color:var(--muted);flex:none}
.row-icon.terra{color:var(--accent);background:var(--accentSoft)}
.row-icon.green{background:var(--successSoft);color:var(--success)}
.row-icon .letter{font-family:var(--serif);font-size:23px}
.list-card{border:1px solid var(--line);border-radius:18px;background:var(--surface);padding:16px;margin:12px 0}
.list-card .title{font-size:15px;font-weight:600;display:block}
.list-card p{font-size:12px;color:var(--muted);margin:10px 0;line-height:1.8}
.list-card .card-actions{display:flex;align-items:center;justify-content:space-between;margin-top:13px;border-top:1px solid var(--line);padding-top:7px}
.tag{font-size:10px;color:var(--muted);background:var(--soft);padding:5px 7px;border-radius:6px;line-height:1.3;display:inline-flex;align-items:center;gap:4px;white-space:nowrap}
.tag.accent{color:var(--accent);background:var(--accentSoft)}
.tag.success{color:var(--success);background:var(--successSoft)}
.tag.danger{color:var(--danger);background:var(--dangerSoft)}
.tag svg{width:11px;height:11px}
.select-circle{width:21px;height:21px;border:1.5px solid var(--line);border-radius:6px;flex:none;display:flex;align-items:center;justify-content:center}
.select-circle.selected{background:var(--accent);border-color:var(--accent);color:var(--bg)}
.select-circle svg{width:14px;height:14px}
.selection-toolbar{display:flex;align-items:center;justify-content:space-between;padding:6px 18px;background:var(--soft);flex:none;border-top:1px solid var(--line)}
.avatar-large{width:72px;height:72px;border-radius:23px;background:var(--accentSoft);color:var(--accent);display:flex;align-items:center;justify-content:center;margin:9px auto 16px}
.avatar-large svg{width:35px;height:35px}
.avatar-large .letter{font-size:37px;font-family:var(--serif)}
.field{display:block;margin:15px 0}
.field>span{display:block;font-size:12px;font-weight:550;margin:0 2px 8px}
.field input,.field textarea,.field select{width:100%;border:1px solid var(--line);border-radius:11px;padding:13px 12px;min-height:48px;font-size:13px;outline:none}
.field textarea{resize:vertical;line-height:1.85;min-height:120px}
.field small{display:block;font-size:10px;line-height:1.8;color:var(--muted);margin:6px 3px 0}
.field-error{font-size:11px;color:var(--danger);padding:6px 0}
.segmented{display:flex;border:1px solid var(--line);border-radius:12px;padding:4px;gap:3px;background:var(--soft)}
.segmented button{flex:1;border-radius:8px;min-height:40px;font-size:11px;padding:6px 5px}
.segmented button.selected{background:var(--surface);box-shadow:0 1px 5px #00000009;color:var(--accent);font-weight:600}
.option-row{display:flex;align-items:center;gap:11px;min-height:65px;padding:11px 2px;border-bottom:1px solid var(--line);width:100%;text-align:left}
.option-row:last-child{border-bottom:0}
.option-row strong{display:block;font-size:13px;font-weight:550}
.option-row small{display:block;color:var(--muted);font-size:11px;line-height:1.7;margin-top:3px}
.radio{width:19px;height:19px;border:1.5px solid var(--line);border-radius:50%;display:flex;align-items:center;justify-content:center;flex:none}
.radio.selected{border-color:var(--accent)}
.radio.selected:after{content:'';width:9px;height:9px;border-radius:50%;background:var(--accent)}
.switch{width:35px;height:21px;border-radius:20px;background:var(--line);padding:3px;flex:none;transition:.2s;display:inline-flex;align-items:center}
.switch:after{content:'';width:15px;height:15px;border-radius:50%;background:var(--surface);box-shadow:0 1px 2px #0002;transition:.2s}
.switch.on{background:var(--accent)}
.switch.on:after{transform:translateX(14px);background:var(--bg)}
.sticky-actions{border-top:1px solid var(--line);background:var(--bg);padding:12px 18px;display:flex;gap:10px;flex:none}
.sticky-actions>.btn{flex:1}
.tabs{display:flex;gap:22px;border-bottom:1px solid var(--line);margin:6px 0 20px}
.tabs button{min-height:44px;color:var(--muted);font-size:12px;position:relative;padding:9px 1px}
.tabs button.active{color:var(--ink);font-weight:550}
.tabs button.active:after{content:'';height:2px;position:absolute;bottom:-1px;left:0;right:0;background:var(--accent);border-radius:4px}
.file-path{font-size:11px;color:var(--muted);margin:5px 0 16px;overflow-wrap:anywhere}
.document{background:var(--surface);border:1px solid var(--line);border-radius:13px;padding:23px 20px;font-size:13px;line-height:1.9}
.document h1{font-family:var(--serif);font-size:25px;font-weight:500;line-height:1.55;margin-bottom:12px}
.document h2{font-size:16px;font-weight:600;margin:24px 0 10px}
.document h3{font-size:14px;font-weight:600;margin:18px 0 8px}
.document p{font-size:13px;line-height:1.9;margin:9px 0}
.document ul{padding-left:18px}
.document li{margin:8px 0}
.document blockquote{margin:16px 0;padding:8px 13px;border-left:2px solid var(--accent);background:var(--soft);color:var(--muted);font-size:12px}
.document table{font-size:10px;width:100%;border-collapse:collapse;margin:14px 0;table-layout:fixed}
.document td,.document th{padding:9px 5px;border:1px solid var(--line);text-align:left;word-break:break-word}
.document th{background:var(--soft)}
pre{background:var(--code);padding:16px;border-radius:11px;white-space:pre-wrap;overflow-wrap:anywhere;font-size:11px;line-height:1.8;color:var(--ink);margin:10px 0}
.diff-row{display:grid;grid-template-columns:25px 12px 1fr;font-family:monospace;font-size:10px;line-height:1.7;padding:5px 9px;overflow-wrap:anywhere;white-space:pre-wrap}
.diff-row.add{background:var(--successSoft);color:var(--success)}
.diff-row.remove{background:var(--dangerSoft);color:var(--danger)}
.diff-row span:first-child{opacity:.65}
.run-card{background:var(--surface);border:1px solid var(--line);border-radius:15px;padding:15px;margin:12px 0}
.run-card h3{font-size:14px;font-weight:550;margin:10px 0 7px}
.run-card p{font-size:11px;color:var(--muted);line-height:1.8}
.run-card .btn{margin-top:12px}
.stat-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:18px 0}
.stat-box{background:var(--soft);border-radius:13px;padding:14px}
.stat-box strong{font-size:22px;font-weight:550;display:block;letter-spacing:-.5px}
.stat-box small{font-size:10px;color:var(--muted);display:block;margin-top:6px}
.progress-track{height:6px;background:var(--soft);border-radius:5px;overflow:hidden;margin:14px 0}
.progress-track span{display:block;width:17%;height:100%;background:var(--accentSeed);border-radius:5px}
.legend-row{display:flex;justify-content:space-between;font-size:12px;padding:11px 0;border-bottom:1px solid var(--line)}
.legend-row span:first-child{color:var(--muted)}
.check-label{display:flex;align-items:flex-start;gap:10px;line-height:1.8;font-size:12px;padding:12px 0;cursor:pointer;min-height:48px}
.check-label input{accent-color:var(--accent);width:18px;height:18px;margin-top:2px;flex:none}
.empty-state{display:flex;align-items:center;justify-content:center;flex-direction:column;flex:1;padding:32px;text-align:center}
.empty-state .halo{background:var(--soft);border-radius:28px;width:86px;height:86px;display:flex;align-items:center;justify-content:center;color:var(--accent);margin-bottom:26px}
.empty-state .halo svg{width:35px;height:35px}
.empty-state h2{font-family:var(--serif);font-size:27px;font-weight:500;line-height:1.6;margin-bottom:11px}
.empty-state p{font-size:12px;color:var(--muted);line-height:1.9;max-width:290px;margin-bottom:24px}
.overlay-host{position:absolute;inset:30px 0 22px;z-index:10;pointer-events:none}
.overlay-host:empty{display:none}
.overlay-scrim{position:absolute;inset:0;background:var(--scrim);pointer-events:auto;border:0;border-radius:0;cursor:default;animation:fade .16s ease}
.sheet{position:absolute;bottom:0;left:0;right:0;max-height:94%;background:var(--bg);border-radius:24px 24px 0 0;pointer-events:auto;box-shadow:0 -12px 50px #00000010;display:flex;flex-direction:column;animation:sheet-in .23s ease;outline:none}
.sheet-handle{height:5px;width:32px;background:var(--line);border-radius:8px;margin:10px auto 0;flex:none}
.sheet-header{display:flex;align-items:center;justify-content:space-between;padding:7px 14px 3px 23px;gap:9px;flex:none}
.sheet-header h2{font-size:18px;font-weight:550;line-height:1.5}
.sheet-content{overflow:auto;padding:0 23px 23px;min-height:0;overscroll-behavior:contain}
.sheet-content>p:first-child{font-size:12px;color:var(--muted);margin:3px 0 16px;line-height:1.8}
.sheet-content .btn.full{margin-top:16px}
.sheet .sheet-foot{padding:12px 23px 19px;border-top:1px solid var(--line);display:flex;gap:10px}
.sheet-foot .btn{flex:1}
.drawer{position:absolute;top:0;bottom:0;left:0;width:86%;background:var(--bg);border-radius:0 23px 23px 0;pointer-events:auto;display:flex;flex-direction:column;animation:drawer-in .2s ease;outline:0}
.drawer-header{display:flex;justify-content:space-between;align-items:center;padding:17px 14px 13px 22px}
.drawer-header strong{font-size:19px;font-weight:550}
.drawer-scroll{padding:0 16px 15px;overflow:auto;flex:1}
.drawer-nav{display:flex;align-items:center;gap:13px;padding:12px 13px;min-height:48px;width:100%;border-radius:11px;font-size:13px;text-align:left}
.drawer-nav.current,.drawer-nav:hover{background:var(--soft)}
.drawer-nav svg{width:18px;height:18px}
.drawer-recent{font-size:12px;min-height:41px;padding:10px 13px;text-align:left;display:block;width:100%;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.drawer-footer{padding:12px 16px;border-top:1px solid var(--line)}
.toast{position:absolute;bottom:29px;left:18px;right:18px;background:var(--ink);color:var(--bg);border-radius:13px;padding:13px 15px;font-size:12px;line-height:1.7;z-index:30;box-shadow:0 5px 25px #0002;pointer-events:none;animation:toast-in .16s ease}
.toast:empty{display:none}
.attachment-strip{display:flex;gap:7px;overflow:auto;padding:0 4px 11px;scrollbar-width:none}
.attachment-mini{display:flex;align-items:center;gap:7px;background:var(--soft);border-radius:10px;padding:7px 9px;min-height:45px;font-size:11px;min-width:155px;text-align:left}
.attachment-mini small{font-size:9px;display:block;color:var(--muted);margin-top:2px}
.attachment-mini svg{width:17px;height:17px}
.attachment-mini .remove{min-width:25px;width:25px;height:25px}
.permission-emblem{width:46px;height:46px;border-radius:14px;background:var(--accentSoft);color:var(--accent);display:flex;align-items:center;justify-content:center;margin:4px 0 15px}
.demo-shortcuts{position:absolute;left:0;top:0;display:none}
.mobile-review-toggle{display:none}
.token-list{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}
.token-block{border:1px solid var(--line);border-radius:12px;padding:12px;min-height:87px}
.token-dot{height:24px;width:24px;border-radius:50%;margin-bottom:8px;border:1px solid var(--line)}
.token-block strong{font-size:11px;display:block}
.token-block small{font-size:10px;color:var(--muted)}
.kbd{font-family:monospace;background:#E2DCCE;padding:3px 6px;border-radius:4px;font-size:10px}
.review-detail-list{padding:0;list-style:none;font-size:12px;color:#706B60}
.review-detail-list li{margin:12px 0;line-height:1.8}
.review-detail-list li:before{content:'—';margin-right:7px;color:#A25940}
.phone :is(button,input,textarea,select){touch-action:manipulation}
.focus-anchor{outline:none}
.status-banner{display:flex;align-items:center;gap:8px;min-height:37px;padding:7px 22px;color:var(--muted);background:var(--soft);font-size:10px;flex:none}
.status-banner svg{width:14px;height:14px}
.demo-label{font-size:9px;color:var(--muted);font-weight:400;letter-spacing:.04em;border:1px solid var(--line);border-radius:5px;padding:3px 5px}
.import-conflict{border:1px solid var(--line);border-radius:13px;padding:14px;margin:14px 0}
.import-conflict strong{font-size:13px}
.key-field{display:flex;align-items:center;border:1px solid var(--line);background:var(--surface);border-radius:11px;overflow:hidden}
.key-field input{border:0}
.key-field button{height:48px;min-width:46px}
.slider-line{display:flex;align-items:center;gap:14px;margin:12px 0}
.slider-line input{accent-color:var(--accent);flex:1;min-width:0}
.slider-line output{width:30px;font-weight:550}
.menu-option{min-height:52px;padding:13px 2px;display:flex;align-items:center;gap:13px;border-bottom:1px solid var(--line);font-size:13px;width:100%;text-align:left}
.menu-option svg{width:19px;height:19px}
.divider{height:1px;background:var(--line);margin:18px 0}
.fine{font-size:10px!important;line-height:1.8!important;color:var(--muted)}


/* Mobile typography & hit areas. */
.user-message,.assistant-message{font-size:16px;line-height:1.8}
.assistant-message p{line-height:1.8}
.assistant-message h3{font-size:18px}
.user-message{padding:13px 16px;margin-bottom:22px}
.assistant-meta{font-size:12px}
.thinking-line{font-size:12px;min-height:40px}
.activity summary{font-size:13px;min-height:52px}
.artifact strong{font-size:14px}
.artifact small{font-size:11px}
.control-strip{padding:0 2px;min-height:48px}
.control-strip button{font-size:11px;min-height:48px;padding:8px 3px}
.composer .send{width:48px;height:48px;min-width:48px;margin:0;position:relative;isolation:isolate;background:none;box-shadow:none}
.composer .send:before{content:'';position:absolute;inset:4px;border-radius:50%;background:var(--accent);z-index:-1}
.composer .send:disabled{background:none;color:var(--muted)}
.composer .send:disabled:before{background:var(--soft)}
.composer textarea{min-height:40px;font-size:16px}
.composer-tools .text-btn{font-size:12px}
.field input,.field textarea,.field select{font-size:14px}
.list-row strong{font-size:15px}
.list-row p{font-size:12px}
.option-row strong{font-size:14px}
.option-row small{font-size:12px}
.document p{font-size:14px}
.document{font-size:14px}
.btn.small{min-height:48px}
.segmented button{min-height:44px}
.attachment-mini{min-height:48px}
.sheet-content>p:first-child{font-size:13px}
.sheet-content .notice{font-size:12px}
.list-card p{font-size:13px}
.list-card .title{font-size:16px}
.home-main p{font-size:14px}
.suggestion{font-size:13px;min-height:48px}
.tag{font-size:11px}
.topbar .title-btn small{font-size:12px}
.control-strip .context-indicator{width:12px;height:12px}
.sheet-content .searchbox{margin-top:10px}

@keyframes spin{to{transform:rotate(360deg)}
}
@keyframes pulse{50%{opacity:.35}
}
@keyframes fade{from{opacity:0}
to{opacity:1}
}
@keyframes sheet-in{from{transform:translateY(20px);opacity:.5}
to{transform:translateY(0);opacity:1}
}
@keyframes drawer-in{from{transform:translateX(-20px);opacity:.4}
to{transform:translateX(0);opacity:1}
}
@keyframes toast-in{from{transform:translateY(5px);opacity:0}
to{transform:translateY(0);opacity:1}
}

@media(min-width:1700px){.review-layout{grid-template-columns:245px minmax(500px,1fr) 300px}
.phone{height:868px}
.stage{padding-top:34px}
}

@media(max-width:1120px){.review-layout{grid-template-columns:190px 1fr}
.review-info{display:none}
.review-nav{padding-left:17px}
.review-header{padding:0 22px}
}

@media(max-width:680px){body{background:var(--bg)}
.review-header,.review-nav,.review-info,.stage-caption{display:none}
.review-layout{display:block;height:100dvh}
.stage{padding:0;height:100dvh;display:block;overflow:hidden}
.phone,.phone.compact{width:100%;height:100dvh;min-height:0;border:0;border-radius:0;box-shadow:none}
.mobile-review-toggle{display:block;position:fixed;top:4px;left:calc(50% - 42px);width:84px;height:24px;font-size:9px;color:var(--muted);z-index:8;letter-spacing:.04em}
.home-main h1{font-size:30px}
.overlay-host{inset:30px 0 22px}
}

body.embed{background:var(--bg)}
body.embed .review-header,body.embed .review-nav,body.embed .review-info,body.embed .stage-caption,body.embed .mobile-review-toggle{display:none}
body.embed .review-layout{display:block;height:100vh}
body.embed .stage{padding:0;height:100vh;overflow:hidden;display:block}
body.embed .phone{width:100%;height:100vh;min-height:0;border:0;border-radius:0;box-shadow:none}

@media(prefers-reduced-motion:reduce){*,*:before,*:after{animation:none!important;transition:none!important;scroll-behavior:auto!important}
}


/* v2 semantic colors: text accents are not filled-button backgrounds. */
:root {
    --actionFill:#A34F36; --onAction:#FFFFFF; --dangerFill:#A33732; --inkFill:#3C3B35;
    --syntaxKeyword:#9B482C; --syntaxString:#40643D; --syntaxNumber:#5D6199; --syntaxComment:#79766D;
    --codeSurface:#F3F1EA; --codeHeader:#EBE8E0; --focus:#A34F36;
    --motionFast:110ms; --motionNormal:240ms; --motionSlow:280ms;
    --motionEase:cubic-bezier(.2,.8,.2,1);
}
[data-theme=dark] {
    --actionFill:#A9563D; --onAction:#FFFFFF; --dangerFill:#A33732; --inkFill:#514D46;
    --syntaxKeyword:#E8AD94; --syntaxString:#B4CEA5; --syntaxNumber:#BABBE8; --syntaxComment:#ADAA9E;
    --codeSurface:#21211F; --codeHeader:#2B2B27; --focus:#E6A086;
}
.phone { isolation:isolate; }
.phone-content { background:var(--bg); }
.page-snapshot { position:absolute!important; inset:30px 0 22px; z-index:3; pointer-events:none; }
.btn.primary { background:var(--actionFill); border-color:var(--actionFill); color:var(--onAction); }
.btn.destructive { background:var(--dangerFill); border-color:var(--dangerFill); color:#FFFFFF; }
.btn.ink { background:var(--inkFill); border-color:var(--inkFill); color:#FFFFFF; }
.composer .send,.composer .send:disabled { color:var(--onAction); }
.composer .send:before { background:var(--actionFill); }
.composer .send:disabled:before { background:var(--actionFill); opacity:.36; }
.select-circle.selected { color:#FFFFFF; background:var(--actionFill); border-color:var(--actionFill); }
.switch.on:after { background:#FFFFFF; }
.btn,.icon-btn,.text-btn,.suggestion,.provider-card,.code-action { transition:background-color var(--motionFast),border-color var(--motionFast),transform var(--motionFast) var(--motionEase); }
:is(.btn,.icon-btn,.suggestion,.code-action):active:not(:disabled) { transform:scale(.97); }
.overlay-host { z-index:10; }
.overlay-host.closing { pointer-events:none; }
.overlay-host.closing * { pointer-events:none!important; }
.overlay-scrim,.sheet,.drawer,.toast { animation:none; }
.sheet,.drawer { will-change:auto; }
.activity summary .chev { transition:transform var(--motionNormal) var(--motionEase); }
.activity[open]>summary .chev,.tool-call[open]>summary .chev { transform:rotate(180deg); }
.tool-call summary .chev { transition:transform var(--motionNormal) var(--motionEase); }
@media(prefers-reduced-motion:reduce) {
    *,*:before,*:after { animation:none!important; transition:none!important; scroll-behavior:auto!important; }
}
[data-motion=off] *,[data-motion=off] *:before,[data-motion=off] *:after { animation:none!important;transition:none!important;scroll-behavior:auto!important; }
.sr-only {position:absolute;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip:rect(0,0,0,0);white-space:nowrap;border:0;}
/* Feedback occupies a lane BELOW a header. No floating snackbar over bottom actions. */
.feedback-lane { flex:none; padding:0 12px 9px; min-width:0; }
.top-feedback { display:flex; align-items:flex-start; gap:9px; border:1px solid var(--line); background:var(--surface); color:var(--ink); border-radius:13px; padding:9px 6px 9px 12px; box-shadow:var(--shadow); }
.feedback-icon { color:var(--success); display:flex;align-items:center;justify-content:center;height:32px; }
.feedback-icon svg {width:17px;height:17px;}
.feedback-text { font-size:12px;line-height:1.7;padding-top:5px;max-height:90px;overflow:auto;overflow-wrap:anywhere; }
.top-feedback .icon-btn { width:36px;height:36px;min-width:36px; }
.top-feedback .icon-btn svg {width:17px;height:17px;color:var(--muted);}
.top-feedback.error { border-color:var(--danger);background:var(--dangerSoft); }
.top-feedback.error .feedback-icon { color:var(--danger); }
.sheet .feedback-lane { padding:4px 18px 8px; }
.reasoning-popover .feedback-lane {padding:0 0 8px;}
/* Context segments retain the repository's eight semantic keys and colors. */
.context-ring { width:13px;height:13px;border-radius:50%;display:inline-block;position:relative;flex:none;transform:rotate(-8deg); }
.context-ring:after {content:'';position:absolute;inset:2.8px;background:var(--bg);border-radius:50%;}
.context-headline {display:flex;align-items:baseline;flex-wrap:wrap;gap:7px;margin:14px 0 19px;}
.context-headline>strong {font-size:35px;font-weight:550;line-height:1.2;letter-spacing:-1px;font-variant-numeric:tabular-nums;}
.context-headline>span {font-size:12px;color:var(--muted);}
.context-headline>div {margin-left:auto;font-size:13px;font-variant-numeric:tabular-nums;}
.context-composition {height:13px;width:100%;border-radius:7px;background:var(--soft);display:flex;overflow:hidden;}
.context-segment {height:100%;flex:none;display:block;transition:width var(--motionNormal) var(--motionEase);}
.context-scale {display:flex;justify-content:space-between;font-size:10px;color:var(--muted);line-height:1.6;margin:8px 0 20px;}
.context-legend-heading {display:flex;justify-content:space-between;color:var(--muted);font-size:10px;padding:0 0 9px;border-bottom:1px solid var(--line);}
.context-legend-row {display:flex;align-items:center;gap:9px;min-height:37px;font-size:12px;}
.context-legend-row .mono {font-size:12px;font-variant-numeric:tabular-nums;}
.context-percent {width:43px;text-align:right;color:var(--muted);font-size:11px;font-variant-numeric:tabular-nums;}
.legend-dot {display:inline-block;width:9px;height:9px;flex:none;border-radius:3px;}
.usage-report {margin-top:20px;margin-bottom:10px;}
/* Model rows carry effective native input capabilities, never inferred from model name. */
.model-option {display:flex;align-items:flex-start;gap:12px;width:100%;text-align:left;min-height:102px;padding:16px 8px 17px;border:1px solid var(--line);border-radius:14px;background:var(--surface);}
.model-option:hover {background:var(--soft);}
.model-option>span.stretch>strong {display:block;font-size:15px;line-height:1.65;overflow-wrap:anywhere;}
.model-option .radio {margin-top:5px;}
.model-symbol {width:32px;height:32px;display:flex;justify-content:center;align-items:center;color:var(--muted);flex:none;}
.model-symbol svg {width:19px;height:19px;}
.model-description {font-size:11px;color:var(--muted);display:block;line-height:1.6;margin:2px 0 10px;}
.native-caps {display:flex;gap:8px;align-items:center;flex-wrap:wrap;color:var(--muted);font-size:10px;line-height:1.5;}
.native-cap {display:inline-flex;align-items:center;gap:3px;}
.native-caps svg {width:14px;height:14px;stroke-width:1.6;}
.native-caps.unknown {font-size:11px;}
/* Discrete reasoning control, inspired by the supplied screenshot. No model chooser inside. */
.quick-scrim {background:rgba(28,27,25,.12);}
[data-theme=dark] .quick-scrim {background:rgba(0,0,0,.15);}
.reasoning-popover {pointer-events:auto;position:absolute;bottom:52px;left:16px;right:16px;padding:13px 16px 14px;border-radius:22px;background:var(--surface);box-shadow:0 15px 50px #0002;border:1px solid var(--line);outline:none;}
.reasoning-top {display:flex;align-items:center;gap:10px;margin-bottom:3px;}
.reasoning-top>svg {width:19px;height:19px;color:var(--muted);}
.reasoning-title {flex:1;min-width:0;text-align:center;display:flex;justify-content:center;align-items:center;flex-wrap:wrap;gap:3px;min-height:54px;border-radius:9px;}
.reasoning-title strong {font-size:15px;font-weight:550;color:var(--accent);}
.reasoning-title>svg {width:14px;height:14px;color:var(--accent);}
.reasoning-title small {width:100%;font-size:10px;color:var(--muted);margin-top:2px;}
.reasoning-top .icon-btn {width:38px;height:48px;min-width:38px;color:var(--muted);}
.reasoning-top .icon-btn svg {width:18px;height:18px;}
.reasoning-slider {position:relative;height:52px;display:flex;align-items:center;--slider-pct:50%;}
.reasoning-track {position:absolute;left:0;right:0;height:28px;border-radius:20px;background:var(--soft);overflow:hidden;}
/* Range fill computed as a gradient so tick and thumb geometry share an inset. */
.reasoning-track {background:linear-gradient(to right,var(--actionFill) 0%,var(--actionFill) var(--slider-pct),var(--soft) var(--slider-pct),var(--soft) 100%);}
.reasoning-ticks {position:absolute;left:17px;right:17px;top:0;height:28px;}
.reasoning-ticks i {width:4px;height:4px;position:absolute;top:12px;margin-left:-2px;border-radius:50%;background:var(--muted);opacity:.45;}
.reasoning-slider input {position:relative;z-index:1;width:100%;height:48px;margin:0;appearance:none;-webkit-appearance:none;background:transparent;cursor:pointer;outline-offset:2px;padding:0;touch-action:pan-y;}
.reasoning-slider input::-webkit-slider-runnable-track {height:28px;background:transparent;border-radius:20px;margin:0 1px;}
.reasoning-slider input::-webkit-slider-thumb {appearance:none;-webkit-appearance:none;width:34px;height:34px;background:#FFFFFF;border:1px solid #0000000D;border-radius:50%;margin-top:-3px;box-shadow:0 1px 6px #0002;}
.reasoning-slider input::-moz-range-track {height:28px;background:transparent;}
.reasoning-slider input::-moz-range-thumb {width:33px;height:33px;background:#FFFFFF;border:1px solid #0000000D;border-radius:50%;box-shadow:0 1px 6px #0002;}
.reasoning-slider.indeterminate input::-webkit-slider-thumb {opacity:0;}
.reasoning-slider.indeterminate input::-moz-range-thumb {opacity:0;}
.reasoning-slider.indeterminate .reasoning-track {background:var(--soft);}
.reasoning-scale {display:flex;justify-content:space-between;color:var(--muted);font-size:10px;gap:8px;}
.reasoning-scale code {font-size:10px;}
.reasoning-wire {font-family:ui-monospace,Consolas,monospace;font-size:11px;line-height:1.6;color:var(--muted);text-align:center;padding:12px 0 4px;overflow-wrap:anywhere;}
.reasoning-popover>.fine {text-align:center;font-size:10px!important;}
.effort-option {width:100%;display:flex;align-items:center;gap:14px;padding:14px 2px;border-bottom:1px solid var(--line);text-align:left;min-height:70px;}
.effort-option strong {font-size:14px;display:flex;gap:10px;align-items:baseline;font-weight:550;}
.effort-option strong code {font-size:12px;font-weight:400;color:var(--accent);}
.effort-option small {display:block;font-size:11px;line-height:1.7;color:var(--muted);margin-top:5px;overflow-wrap:anywhere;}

function icon(name,cls=''){return `<svg class="${cls}" viewBox="${name==='mark'?'0 0 44 44':'0 0 24 24'}" aria-hidden="true">${icons[name]||icons.file}</svg>`}
function esc(s){return String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function action(name,label,cl='btn',ico='',disabled=false){return `<button class="${cl}" data-action="${esc(name)}" ${disabled?'disabled':''}>${ico?icon(ico):''}${label}</button>`}
function ib(name,label,ico){return `<button class="icon-btn" data-action="${name}" aria-label="${label}" title="${label}">${icon(ico)}</button>`}
function tag(t,cls=''){return `<span class="tag ${cls}">${t}</span>`}
function mark(cls='mark'){return `<span class="${cls}">${icon('mark')}</span>`}

function titlebar(title,back='drawer',right='',subtitle=''){return `<header class="topbar">${ib(back,back==='drawer'?'打开导航':'返回',back==='drawer'?'menu':'back')}<div class="heading">${title}${subtitle?`<span>${subtitle}</span>`:''}</div>${right}</header>`}
function documentMarkupV1(){return `<article class="document"><div class="label">WORKSPACE / DOCUMENT</div><h1 class="mt16">AgentApp<br>迭代计划</h1><p class="muted">先整理层级，再打磨交互。保留已经可靠的执行能力。</p><blockquote>目标不是删掉功能，而是让功能在需要的时候出现。</blockquote><h2>01 · 整理信息层级</h2><p>统一顶部栏与输入框，将工具执行、子代理和计划状态收进会话面板。</p><ul><li>保留现有模型切换和权限边界。</li><li>为文件产物提供清晰的预览入口。</li><li>工具记录默认收起，可查看完整详情。</li></ul><h2>02 · 完善关键状态</h2><table><thead><tr><th>状态</th><th>界面反馈</th></tr></thead><tbody><tr><td>执行中</td><td>显示当前动作，可停止</td></tr><tr><td>等待审批</td><td>明确命令与影响范围</td></tr><tr><td>请求失败</td><td>保留消息与错误</td></tr></tbody></table><h2>03 · 验收</h2><p>检查浅色、深色、小屏、长文字，以及键盘弹出后的输入体验。</p><div class="divider"></div><p class="fine">示例文档 · 仅用于原型评审，不代表真实仓库任务结果。</p></article>`}
function composerV1(running=false){return `<div class="composer-wrap">${running?`<div class="task-status">${state.runStopped?icon('stop'):'<span class="spinner"></span>'}<span class="stretch">${state.runStopped?'已停止 · 已有记录保留':'正在处理 · 等待命令审批'}</span>${action('sheet:approval','查看','text-btn')}</div>`:''}<div class="composer">${state.attachments.length?`<div class="attachment-strip">${state.attachments.map((a,k)=>`<button class="attachment-mini" data-action="sheet:attachment">${icon('file')}<span class="stretch">${esc(a)}<small>${state.mediaDelivery==='native'?'模型原生读取':'工作区工具读取'}</small></span></button>`).join('')}</div>`:''}<textarea id="message-input" aria-label="输入消息" placeholder="${state.screen==='home'?'有什么想一起完成的？':'继续这个想法…'}" rows="2" ${running&&!state.runStopped?'aria-describedby="running-hint"':''}>${esc(state.draft)}</textarea><div class="composer-footer"><div class="composer-tools">${ib('sheet:attach','添加附件','plus')}${action('sheet:model',esc(state.model.split(' · ')[0]),'text-btn','down',running&&!state.runStopped)}</div>${action(running&&!state.runStopped?'stop':'send','',`icon-btn send`,running&&!state.runStopped?'stop':'send',!(running&&!state.runStopped)&&!state.draft.trim()&&!state.attachments.length).replace('<button','<button aria-label="'+(running&&!state.runStopped?'停止生成':'发送消息')+'"')}</div></div><div class="control-strip"><button data-action="sheet:permissions" ${running&&!state.runStopped?'disabled':''}>${icon('shield')}${esc(state.permission)}${icon('down')}</button><button data-action="sheet:reasoning">${icon('spark')}${esc(state.reasoning==='跟随配置'?'思考 · 跟随配置':'思考 · '+state.reasoning)}</button><button data-action="sheet:context"><span class="context-indicator"></span>${state.unknown?'容量未配置':state.compacted?'约 6%':'约 17%'}</button></div></div>`}
function chatHeader(child=false){return `<header class="topbar">${ib(child?'go:session':'go:history','返回','back')}<div class="heading"><button class="title-btn" data-action="${child?'go:session':'sheet:model'}" ${state.screen==='running'&&!state.runStopped?'disabled':''}><strong>${child?'梳理现有功能':esc(state.agent)}</strong><small>${child?'子代理 · 只读':'把想法整理成迭代计划'}${!child?icon('down'):''}</small></button></div>${child?(state.childStopped?tag('已中止'):ib('sheet:stop-child','中止子代理','stop')):ib('go:session','打开会话面板','tree')}</header>`}
function artifact(){return `<button class="artifact" data-action="go:file-view"><span class="file-icon">${icon('file')}</span><span class="stretch"><strong>iteration-plan.md</strong><small>Markdown · 3.2 KB · 已写入工作区</small></span>${icon('chevron')}</button>`}
function activityV1(running=false){return `<details class="activity" ${running?'open':''}><summary>${running?'<span class="spinner"></span>':icon('check','success')}<span class="stretch">${running?'正在执行计划':'完成了 4 个步骤'}</span><span class="muted">${running?'2 / 4':'查看过程'}</span>${icon('down','chev')}</summary><div class="activity-body"><div class="timeline"><div class="timeline-item"><strong>读取项目说明</strong><br>read_file · project-notes.md</div><div class="timeline-item"><strong>子代理梳理功能</strong><br>run_subagent · 独立上下文</div><div class="timeline-item ${running?'running':''}"><strong>${running?'等待命令审批':'生成迭代计划'}</strong><br>${running?'run_command · 用户确认后执行':'write_file · iteration-plan.md'}</div>${!running?'<div class="timeline-item"><strong>核对文件内容</strong><br>read_file · 完成</div>':''}</div>${action('go:session','打开会话面板','text-btn','tree')}</div></details>`}
function chatBodyV1(running=false){if(state.messageDeleted)return `<div class="content chat-scroll"><div class="user-message">${esc(state.chatText)}</div><div class="notice">助手消息与关联工具记录已从本演示会话移除。已执行的文件修改不会撤销。</div></div>`;return `<div class="content chat-scroll"><div class="user-message">${esc(state.chatText)}<div class="user-file">${icon('file')}project-notes.md <span class="stretch"></span>工作区</div></div><div class="assistant-message"><div class="assistant-meta">${mark('mini-mark')} ${esc(state.agent)} <span>· ${esc(state.model.split(' · ')[0])}</span></div><details><summary class="thinking-line">${icon('down')}思考过程 · ${running?'展开查看':'已完成'}</summary><p class="fine">演示占位：原生应用在这里展示模型实际返回的 thinking 字段；没有返回时不显示此入口。</p></details><p>${running?'我会先梳理已有功能，再将修改拆成可以逐步验收的任务。':(state.forms['message-edit']?esc(state.forms['message-edit']):'已经整理好了。我把改进拆成三个阶段，优先解决日常使用中最明显的阻力。')}</p>${activity(running)}${running?`<div class="notice warning"><div class="row gap6">${icon('shield')}<strong>有一项操作需要你的确认</strong></div><p class="mt8">准备在应用工作区执行命令。查看完整命令和目录后，再决定是否允许。</p>${action('sheet:approval','审阅这次操作','btn full mt16','arrow')}</div>`:`<h3>先把体验的骨架搭好</h3><p>从聊天布局开始，把频繁使用的操作留在手边，把复杂参数收进按需展开的面板。</p>${artifact()}<p>原有的工具、权限和文件能力不变。每个阶段都附上了可单独检查的验收点。</p><div class="message-actions">${ib('copy','复制回答','copy')}${ib('sheet:message-edit','编辑消息','edit')}${ib('sheet:message-menu','更多消息操作','more')}<span class="meta">${state.historyEdited?'已编辑 · 上下文摘要已清除':'14:32'}</span></div>`}</div></div>`}
function home(){return titlebar('AgentApp','drawer',`${action('sheet:agent-select',esc(state.agent),'text-btn','down')}`)+`<div class="home-main">${mark()}<h1>把想法，<br>慢慢变成现实。</h1><p>从一个问题、一份文件，<br>或一件想完成的小事开始。</p><div class="suggestions">${action('suggest:整理这份项目说明，给我一份可执行的迭代计划。','整理文件','suggestion','folder')}${action('suggest:阅读工作区中的代码，帮我梳理结构和风险。','理解代码','suggestion','code')}${action('suggest:帮我润色这份文稿，保留我的语气。','打磨文字','suggestion','edit')}</div></div><div class="home-footer-label">你的模型、文件与工具，在同一个对话里。</div>`+composer()}
function listHeader(title,sub,kind){return titlebar(title,'drawer',ib('list-menu:'+kind,'列表操作','more'))+`<div class="content"><div class="page-intro"><h1>${title}</h1><p>${sub}</p></div>${searchbox(kind)}`}
function searchbox(kind){return `<label class="searchbox">${icon('search')}<input data-search="${kind}" aria-label="搜索${kind}" placeholder="搜索${({history:'对话',agents:'Agent',providers:'配置',files:'文件',skills:'Skill',memory:'记忆',models:'模型'})[kind]||''}" value="${esc(state.query)}"></label>`}
function matches(item){return (item.name+' '+item.description).toLowerCase().includes(state.query.toLowerCase())}
function selection(id){return `<span class="select-circle ${state.selected.has(id)?'selected':''}">${state.selected.has(id)?icon('check'):''}</span>`}
function listFooter(kind){return state.manage?`<div class="selection-toolbar"><span class="muted">已选 ${state.selected.size} 项</span>${action('select-all:'+kind,'全选','text-btn')}${action('export:'+kind,'导出','text-btn','',!state.selected.size)}${action('sheet:delete','删除','text-btn danger','trash',!state.selected.size)}</div>`:''}
function history(){let group='';const data=conversations.filter(matches);return titlebar(state.manage?'管理会话':'对话','drawer',state.manage?action('manage:history','完成','text-btn'):ib('list-menu:history','会话操作','more'))+`<div class="content"><div class="page-intro"><h1>继续之前的想法</h1><p>所有对话都保存在本机。</p></div>${searchbox('history')}${!state.manage?action('new-chat','新对话','btn full','plus'):''}<div id="list-results">${data.map(c=>{let heading=c.date!==group?`<div class="section-title">${c.date}</div>`:'';group=c.date;return heading+`<button class="list-row" data-action="${state.manage?'select:'+c.id:'go:chat'}">${state.manage?selection(c.id):''}<span class="stretch"><strong>${esc(c.name)}</strong><p>${esc(c.description)}</p></span>${!state.manage?icon('chevron'):''}</button>`}).join('')||'<p class="inline-note">没有匹配的对话。</p>'}</div></div>`+listFooter('history')}
function agentsPage(){return listHeader('Agents','不同的指令与工具边界，适合不同的事。','agents')+`<div id="list-results">${agents.filter(matches).map(a=>`<article class="list-card"><div class="row"><button class="row-icon terra" data-action="edit:agents:${a.id}" aria-label="编辑${esc(a.name)}"><span class="letter">${a.glyph}</span></button><div class="stretch"><strong class="title">${esc(a.name)}</strong><div class="mt8">${tag(a.model)}</div></div>${state.manage?action('select:'+a.id,selection(a.id),'icon-btn'):ib('edit:agents:'+a.id,'编辑 Agent','more')}</div><p>${esc(a.description)}</p><div class="card-actions"><span class="fine">${a.tools}</span>${action('use-agent:'+a.name,'开始对话','text-btn','arrow')}</div></article>`).join('')||'<p class="inline-note">没有匹配的 Agent。</p>'}</div>${action('create:agents','新建 Agent','btn full mt16','plus')}</div>`+listFooter('agents')}
function field(label,key,value='',hint='',type='text'){return `<label class="field"><span>${label}</span><input data-field="${key}" type="${type}" value="${esc(state.forms[key]??value)}" ${type==='number'?'min="1"':''}>${hint?`<small>${hint}</small>`:''}</label>`}
function textarea(label,key,value='',hint=''){return `<label class="field"><span>${label}</span><textarea data-field="${key}">${esc(state.forms[key]??value)}</textarea>${hint?`<small>${hint}</small>`:''}</label>`}
function currentItem(kind){const arr=({agents,providers,skills,memory:memories})[kind];return arr.find(a=>a.id===state.editId)||arr[0]||{name:'',description:''}}
function agentEdit(){const a=state.newRecord?{name:'',description:'',glyph:'A'}:currentItem('agents');return titlebar(state.newRecord?'新建 Agent':'编辑 Agent','go:agents',action('save:agents','保存','text-btn'))+`<div class="content"><button class="avatar-large" data-action="sheet:avatar" aria-label="更换 Agent 头像"><span class="letter">${a.glyph}</span></button>${field('名称','agent-name',a.name)}${field('一句话介绍','agent-description',a.description)}${textarea('系统提示词','agent-prompt','你是一个细心、可靠的助手。先理解用户目标，再执行必要的操作；清楚说明结果和不确定性。','仅定义助手行为，工具执行仍受应用权限边界约束。')}<div class="section-title">默认模型</div><button class="option-row" data-action="sheet:agent-model">${icon('model')}<span class="stretch"><strong>${state.forms['agent-model']||'跟随全局配置'}</strong><small>会话中的模型选择可以覆盖这里。</small></span>${icon('chevron')}</button><div class="section-title">工具授权</div><button class="option-row" data-action="toggle:toolAll"><span class="stretch"><strong>允许全部工具</strong><small>对应 AgentProfile.tools = 空列表</small></span><span class="switch ${state.toolAll?'on':''}"></span></button>${!state.toolAll?`<div class="notice warning mt16">至少选一项。当前数据模型无法用空列表表示“禁止全部工具”。</div>${tools.map(t=>`<label class="check-label"><input type="checkbox" data-tool="${t}" ${state.toolSelections.has(t)?'checked':''}><code>${t}</code></label>`).join('')}`:'<p class="inline-note">实际执行时仍检查会话权限、目录范围和 Android 权限。</p>'}</div>`}
function providersPageV1(){return listHeader('模型配置','把你使用的服务连接到 AgentApp。','providers')+`<p class="fine mb16">示例配置 · 未连接真实服务</p><div id="list-results">${providers.filter(matches).map(p=>`<article class="list-card"><div class="row"><div class="row-icon"><span class="letter">${p.glyph}</span></div><div class="stretch"><strong class="title">${esc(p.name)}</strong><p style="margin:4px 0 0">${esc(p.description)}</p></div>${state.manage?action('select:'+p.id,selection(p.id),'icon-btn'):ib('edit:providers:'+p.id,'编辑模型配置','more')}</div><div class="mt16 row between"><span class="fine">默认模型</span><span style="font-size:12px">${esc(p.model)}</span></div><div class="card-actions">${action('default-provider:'+p.id,p.id===state.selectedProviderId?'全局默认':'设为默认','text-btn',p.id===state.selectedProviderId?'check':'',p.id===state.selectedProviderId)}${action('edit:providers:'+p.id,'编辑配置','text-btn','arrow')}</div></article>`).join('')||'<p class="inline-note">没有匹配的配置。</p>'}</div>${action('create:providers','添加模型配置','btn full mt16','plus')}</div>`+listFooter('providers')}
function providerEdit(){const p=state.newRecord?{name:'',model:''}:currentItem('providers');const custom=state.providerType==='自定义模板';return titlebar(state.newRecord?'添加模型配置':'编辑模型配置','go:providers',action('save:providers','保存','text-btn'))+`<div class="content"><p class="fine mb16">演示表单 · 请勿输入真实 API Key</p>${field('配置名称','provider-name',p.name)}<label class="field"><span>接口协议</span><select id="provider-type">${['Anthropic','OpenAI 兼容','Gemini','自定义模板'].map(t=>`<option ${state.providerType===t?'selected':''}>${t}</option>`).join('')}</select></label>${field('API 地址','provider-url',state.providerType==='Anthropic'?'https://api.anthropic.com':state.providerType==='Gemini'?'https://generativelanguage.googleapis.com':'https://api.example.com/v1','保持现有 Provider 对地址与路径的处理方式。','url')}<label class="field"><span>API Key</span><div class="key-field"><input id="api-key" type="password" placeholder="仅演示 · 不要输入真实密钥" autocomplete="off" aria-label="API Key（不要输入真实密钥）"><button data-action="reveal-key" aria-label="显示或隐藏密钥">${icon('eye')}</button></div><small>正式实现遵循仓库当前存储策略；本设计不承诺已实现加密。</small></label>${field('默认模型 ID','provider-model',p.model||'','可手动输入；示例名称不是实际 API 模型 ID。')}<div class="row wrap">${action('fetch-models','拉取模型列表','btn small','refresh')}${action('sheet:test-connection','测试连接','btn small','model')}${action('sheet:provider-models','查看缓存模型','text-btn')}</div><details class="activity mt24"><summary>${icon('settings')}<span class="stretch">生成参数</span>${icon('down','chev')}</summary><div class="activity-body">${field('温度（可选）','temperature','','留空表示不发送参数；不擅自补默认值。','number')}${field('最大输出 Token（可选）','max-output','','留空不限制可选输出字段；沿用现有校验。','number')}${custom?'<div class="notice">自定义模板不会自动注入思考参数。</div>':`<label class="field"><span>思考强度</span><select data-field="provider-effort"><option>跟随模型默认（不发送）</option><option>关闭</option><option>低</option><option>中</option><option>高</option>${state.providerType==='Gemini'?'':'<option>很高</option><option>最大</option>'}</select><small>正式选项必须来自 reasoningSupportFor 的结果，不把这份演示列表硬编码到所有模型。</small></label>`}${state.providerType==='Anthropic'?`<label class="field"><span>Anthropic 思考协议</span><select><option>自动</option><option>自适应</option><option>手动预算</option></select><small>开启思考时不能同时配置温度，保留 temperatureConflictFor 校验。</small></label>`:''}</div></details><details class="activity"><summary>${icon('model')}<span class="stretch">模型能力与上下文</span>${icon('down','chev')}</summary><div class="activity-body"><p>以下是当前模型的用户覆盖项，刷新模型列表不能覆盖手动设置。</p>${['图片','PDF','音频','视频'].map((t,i)=>`<label class="check-label"><input type="checkbox" ${i<2?'checked':''}>${t}原生输入</label>`).join('')}${field('上下文窗口（Token）','context-limit','200000','未填写时显示“容量未配置”，不猜测模型上限。','number')}</div></details><details class="activity"><summary>${icon('code')}<span class="stretch">高级连接设置</span>${icon('down','chev')}</summary><div class="activity-body">${field('模型列表 URL（可选）','models-url','','留空沿用协议推导地址。')}${textarea('附加请求头','headers','{}','可能包含凭据；不含 Key 的导出也必须排除附加头。')}${custom?`${textarea('请求模板','request-template','{"model":"${model}","messages":${messages}}','占位符：${messages} ${tools} ${model} ${system}')}${field('响应提取路径','response-path','$.choices[0].message.content')}${field('SSE 增量路径','stream-path','$.choices[0].delta.content')}`:''}</div></details></div>`}
function contentList(kind){const isMemory=kind==='memory';const arr=isMemory?memories:skills;const label=isMemory?'长期记忆':'Skills';return listHeader(label,isMemory?'把值得留住的信息，单独记下来。':'把熟练的做法，整理成可复用的指令。',kind)+`<div id="list-results">${arr.filter(matches).map(a=>`<button class="list-row" data-action="${state.manage?'select:'+a.id:'edit:'+kind+':'+a.id}">${state.manage?selection(a.id):`<span class="row-icon ${isMemory?'':'terra'}">${icon(isMemory?'memory':'skill')}</span>`}<span class="stretch"><strong>${esc(a.name)}</strong><p>${esc(a.description)}</p><div class="mt8">${isMemory?`<span class="fine">${a.date}</span>`:tag('v'+a.version)+' '+tag(a.license)}</div></span>${!state.manage?icon('chevron'):''}</button>`).join('')||'<p class="inline-note">没有匹配项。</p>'}</div>${action('create:'+kind,isMemory?'新建记忆':'新建 Skill','btn full mt24','plus')}</div>`+listFooter(kind)}
function contentEdit(kind){const isMemory=kind==='memory';const a=state.newRecord?{name:'',description:''}:currentItem(kind);return titlebar(state.newRecord?(isMemory?'新建记忆':'新建 Skill'):(isMemory?'编辑记忆':'编辑 Skill'),'go:'+kind,action('save:'+kind,'保存','text-btn'))+`<div class="content">${!isMemory?`<div class="file-path mono">skills/${esc(a.name||'new-skill')}/SKILL.md</div>`:''}${field(isMemory?'标题':'名称（短横线命名）',kind+'-name',a.name)}${!isMemory?`${field('何时使用',kind+'-description',a.description)}<div class="row"><div class="stretch">${field('版本','skill-version',a.version||'1.0.0')}</div><div class="stretch">${field('许可证','skill-license',a.license||'MIT')}</div></div>`:''}${textarea(isMemory?'记忆正文':'指令正文（Markdown）',kind+'-body',isMemory?(a.description+'\n\n这是用于体验编辑流程的示例记忆。'):'# 工作方式\n\n1. 先理解输入与用户目标。\n2. 列出发现的具体问题。\n3. 按影响程度提供建议。\n4. 保留原文的事实与语气。','保存到原型内存；刷新页面恢复演示数据。')}<div class="notice">${isMemory?'记忆保留为独立 Markdown 文件；是否检索由现有工具和引擎决定。':'不新增远程市场、版本更新检查或技能启停开关。'}</div>${!state.newRecord?action('delete-current:'+kind,'删除'+(isMemory?'记忆':' Skill'),'text-btn danger mt24','trash'):''}</div>`}

    const anim = el.animate(frames,{duration,easing:'cubic-bezier(.2,.8,.2,1)',fill:'none',...options});

function composer(running = false) {
    const model = activeModel();
    const explicit = state.effortValue !== null;
    const effective = explicit ? state.effortValue : model.modelDefault;
    const caption = explicit ? `${effortLabels[effective]} · ${effective}` : `跟随${effective?' · '+effective:''}`;
    let html = composerV1(running);
    html = html.replace(/<button data-action="sheet:reasoning">[\s\S]*?<\/button>/, model.efforts?.length ? `<button data-action="sheet:reasoning-quick" aria-label="调整思考强度，${esc(caption)}">${icon('spark')}<span>${esc(caption)}</span>${icon('down')}</button>` : '');

function miniContext() {
    const seg = contextSegments();
    const total = seg.reduce((n,s)=>n+s.tokens,0);
    const denom = state.unknown ? total : Math.max(total,200000);

    const stops=seg.filter(s=>s.tokens>0).map(s=>{let a=cumulative;cumulative+=s.tokens/denom*100;return `${s.color} ${a}% ${cumulative}%`;});

> 文件与工具细节需要时再展开，阅读不被打断。

## 01 · 信息有层次

普通段落保持稳定行高。中文不靠增大字距制造“设计感”；长链接和路径允许合理折行。

- 保留模型切换、工具执行与授权边界。
    - 复杂参数放入详细面板。
    - 工具结果在原地展开，不跳出对话。
- 已完成内容不反复淡入，流式输出也不闪烁。

### 一份可执行的清单

1. 先统一阅读排版。
2. 再补充组件与交互反馈。
3. 最后检查长内容与小屏。

- [x] 浅色与深色采用同一套层级
- [x] 代码块有独立复制与换行
- [ ] 在真实设备验证大字体与手势返回

## 02 · 代码更清楚

代码默认局部横向滚动，可以切换自动换行；复制保留原始文本，不带语法高亮标记。

\`\`\`kotlin

function handleV2(act) {
    const [verb,...parts]=act.split(':');const value=parts.join(':');
    if(verb==='reasoning-value'){commitEffort(value,true);return;}
    if(verb==='reasoning'){commitEffort(value==='跟随配置'?'follow':Object.keys(effortLabels).find(k=>effortLabels[k]===value)||value,true);return;}
    if(verb==='model'){
        state.model=value;
        const unsupported=state.effortValue!==null&&!activeModel().efforts?.includes(state.effortValue);
        if(unsupported){state.effortValue=null;state.reasoning='跟随配置';}
        close();render();toast(unsupported?'新模型不支持原思考档位，已恢复跟随配置。':'已更新当前会话模型，不改变全局默认。');return;
    }
    if(act==='reasoning-reset'){commitEffort('follow');return;}
    if(act==='banner-close'){dismissBanner();return;}
    if(act==='banner-demo'){toast('更改已保存。横幅位于标题栏下方，不遮挡输入、发送或底部确认按钮。');return;}
    if(act==='motion-replay'){replayMotion();return;}
    if(act==='motion-toggle'){state.motion=!state.motion;if(!canAnimate())document.getAnimations().forEach(a=>a.finish());document.documentElement.dataset.motion=canAnimate()?'on':'off';renderReview();return;}
    if(act==='markdown-stream'){runMarkdownStream();return;}
    if(verb==='markdown-tab'){state.markdownTab=value;render();return;}
    if(verb==='code-wrap'){
        state.codeWrap[value]=!(state.codeWrap[value]??false);
        const node=document.querySelector(`[data-code-id="${CSS.escape(value)}"]`), pre=node?.querySelector('pre');
        pre?.classList.toggle('code-wrapped',state.codeWrap[value]);const b=node?.querySelector('[data-action^="code-wrap:"]');
        if(b){b.setAttribute('aria-pressed',String(state.codeWrap[value]));b.innerHTML=icon('wrap')+'<span>'+(state.codeWrap[value]?'不换行':'换行')+'</span>';}
        return;
    }
    if(verb==='code-copy'){
        const text=codeRegistry.get(value)||'';
        const copied=()=>{state.codeCopied[value]=true;const b=document.querySelector(`[data-action="code-copy:${CSS.escape(value)}"]`);if(b)b.innerHTML=icon('check')+'<span>已复制</span>';};
        if(navigator.clipboard?.writeText)navigator.clipboard.writeText(text).then(copied).catch(()=>toast('剪贴板被浏览器阻止，可在代码区域选择并复制。'));
        else {const box=document.createElement('textarea');box.value=text;box.style.position='fixed';box.style.opacity='0';document.body.append(box);box.select();let ok=false;try{ok=document.execCommand('copy');}catch{}box.remove();if(ok)copied();else toast('请选中代码区域手动复制；浏览器未开放剪贴板。');}
        return;
    }
    if(act==='unknown-toggle'){state.unknown=!state.unknown;render();return;}
    handleV1(act);
}

/** Small LCS for bounded DEMO fixtures only. Native implementation uses FileChanges.diff. */
function demoDiff(before,after,start=1) {
    const a=before===''?[]:before.split('\n'), b=after===''?[]:after.split('\n');
    if(a.length*b.length>100000) return null;
    const dp=Array.from({length:a.length+1},()=>Array(b.length+1).fill(0));
    for(let i=a.length-1;i>=0;i--)for(let j=b.length-1;j>=0;j--)dp[i][j]=a[i]===b[j]?dp[i+1][j+1]+1:Math.max(dp[i+1][j],dp[i][j+1]);
    const lines=[];let i=0,j=0,add=0,remove=0;
    while(i<a.length||j<b.length){
        if(i<a.length&&j<b.length&&a[i]===b[j]){lines.push({kind:'same',old:start+i,new:start+j,text:a[i]});i++;j++;}
        else if(j<b.length&&(i===a.length||dp[i][j+1]>=dp[i+1][j])){lines.push({kind:'add',old:null,new:start+j,text:b[j]});j++;add++;}
        else{lines.push({kind:'remove',old:start+i,new:null,text:a[i]});i++;remove++;}
    }
    return {lines,add,remove};
}

/* Incremental keyed DOM patching keeps controls, scroll positions and focus stable.
   The Android implementation should use stateful Compose components, not this web code. */
function nodeKey(n) {
    if(n.nodeType!==1)return null;
    for(const k of ['data-ui-key','data-detail-key','id','data-field','data-search','data-action'])if(n.hasAttribute(k))return k+':'+n.getAttribute(k);
    return null;
}

        if(!d.dataset.detailKey)d.dataset.detailKey=`${state.overlay||state.screen}:details:${(d.querySelector('summary .stretch')?.textContent||d.querySelector('summary')?.textContent||i).trim().slice(0,65)}`;
        if(d.dataset.detailKey in state.detailOpen)d.open=state.detailOpen[d.dataset.detailKey];

function patchNode(old,next,changes) {
    if(old.nodeType===3){if(old.data!==next.data){changes.text.add(old.parentElement);old.data=next.data;}return;}
    if(old.nodeType!==1)return;
    for(const a of [...old.attributes])if(!next.hasAttribute(a.name)&&!['data-animating'].includes(a.name))old.removeAttribute(a.name);
    for(const a of [...next.attributes])if(old.getAttribute(a.name)!==a.value){old.setAttribute(a.name,a.value);changes.attrs.add(old);}
    if(old instanceof HTMLInputElement){if(old.type!=='file'&&old.value!==next.value&&old!==document.activeElement)old.value=next.value;old.checked=next.checked;}
    if(old instanceof HTMLTextAreaElement){if(old!==document.activeElement)old.value=next.value;return;}
    patchChildren(old,next,changes);
    if(old instanceof HTMLSelectElement&&old!==document.activeElement)old.value=next.value;
}
function patchChildren(parent,nextParent,changes) {
    const olds=[...parent.childNodes].filter(n=>!(n.nodeType===1&&n.classList.contains('feedback-lane')));
    const used=new Set();let cursor=parent.firstChild;
    for(const next of [...nextParent.childNodes]){
        while(cursor?.nodeType===1&&cursor.classList.contains('feedback-lane'))cursor=cursor.nextSibling;
        const key=nodeKey(next);
        let old=key?olds.find(n=>!used.has(n)&&nodeKey(n)===key):null;
        if(!old&&!key&&cursor&&!used.has(cursor)&&!nodeKey(cursor)&&cursor.nodeType===next.nodeType&&cursor.nodeName===next.nodeName)old=cursor;
        if(!old&&!key)old=olds.find(n=>!used.has(n)&&!nodeKey(n)&&n.nodeType===next.nodeType&&n.nodeName===next.nodeName);
        if(old){used.add(old);if(old!==cursor)parent.insertBefore(old,cursor);patchNode(old,next,changes);cursor=old.nextSibling;}
        else{const n=next.cloneNode(true);parent.insertBefore(n,cursor);changes.added.add(n);cursor=n.nextSibling;}
    }
    for(const old of olds)if(!used.has(old)){if(old.nodeType===1)changes.removed.push({node:old.cloneNode(true),rect:old.getBoundingClientRect()});old.remove();}
}
const motionSelector='.provider-card,.list-row,.list-card,.field,.notice,.section-title,.sticky-actions,.selection-toolbar,.attachment-strip,.attachment-mini,.composer,.task-status,.tabs,.tool-scenario-tabs,.md-code,.inline-diff,.tool-shell,.run-card,.option-row,.model-option,.effort-option';

function animateChanged(root,changes,oldRects,label='state') {

}

function renderOverlay() {

function renderFeedback(animate=false) {
    document.getElementById('toast')?.remove();
    if(!state.banner){document.querySelectorAll('.feedback-lane:not(.feedback-exiting)').forEach(n=>n.remove());return;}
    const dialog=state.overlay?document.querySelector('#overlay [role=dialog]'):null;
    const header=dialog?.querySelector('.sheet-header,.drawer-header,.reasoning-top')||document.querySelector('#phone-content .topbar');if(!header)return;
    let lane=document.querySelector('.feedback-lane:not(.feedback-exiting)');const added=!lane;
    if(!lane){lane=document.createElement('div');lane.className='feedback-lane';lane.addEventListener('mouseenter',()=>clearTimeout(toastTimer));lane.addEventListener('focusin',()=>clearTimeout(toastTimer));lane.addEventListener('mouseleave',scheduleBanner);lane.addEventListener('focusout',scheduleBanner);}
    const html=`<div class="top-feedback ${state.banner.type||'info'}"><span class="feedback-icon">${icon(state.banner.type==='error'?'info':'check')}</span><span class="stretch feedback-text" role="${state.banner.type==='error'?'alert':'status'}" aria-live="${state.banner.type==='error'?'assertive':'polite'}">${esc(state.banner.text)}</span>${ib('banner-close','关闭消息提示','close')}</div>`;
    if(lane.innerHTML!==html)lane.innerHTML=html;
    if(lane.previousElementSibling!==header)header.after(lane);
    if(animate&&added){const height=lane.getBoundingClientRect().height;lane.style.overflow='hidden';const a=animateElement(lane,[{height:'0px',opacity:0,transform:'translateY(-6px)'},{height:height+'px',opacity:1,transform:'translateY(0)'}],motionTokens.banner,'top-banner');if(a)a.onfinish=()=>{lane.style.overflow='';};}
    else if(animate)animateElement(lane.querySelector('.feedback-text'),[{opacity:.4},{opacity:1}],motionTokens.state,'banner-update');
}
function dismissBanner() {
    clearTimeout(toastTimer);state.banner=null;
    const lane=document.querySelector('.feedback-lane');if(!lane)return;lane.classList.add('feedback-exiting');lane.style.overflow='hidden';
    lane.getAnimations().forEach(a=>a.cancel());const a=animateElement(lane,[{opacity:1,height:lane.getBoundingClientRect().height+'px'},{opacity:0,height:'0px'}],motionTokens.exit,'banner-exit');if(a)a.onfinish=()=>lane.remove();else lane.remove();
}
function renderReview() {
    renderReviewV2();
    const info=document.getElementById('review-info');info.innerHTML=info.innerHTML.replace('DESIGN V2 /','DESIGN V3 /').replace('25 个页面','26 个页面').replace('工具详情在原位置展开','工具与 Diff 在原位置展开');
    info.insertAdjacentHTML('beforeend',`<div class="rule"></div><div class="eyebrow">V3 / LIGHTWEIGHT FLOW</div><p>工具收起是一行，展开才出现输出底板。命令、Diff 不再套步骤卡片。</p><div class="column">${action('go:tool-lab','查看工具记录样本','review-btn')}${action('new-chat','模拟回到新对话','review-btn')}</div><p class="fine" style="color:#817B6C">冷启动：新对话；历史：侧栏。<br>本轮创建的演示会话：${state.demoCreatedCount} 条。</p>`);
}
function navigate(route,push=true) {
    if(!screenMap[route])return;
    if(state.overlay==='compacting'){toast('请先等待或取消上下文压缩。');return;}
    if(state.streamingMarkdown){clearInterval(markdownTimer);state.streamingMarkdown=false;}
    motionDirection=push?1:-1;
    if(push&&route!==state.screen)state.stack.push(state.screen);
    if(route!==state.screen)state.banner=null;
    state.screen=route;state.overlay=null;state.query='';state.manage=false;state.selected.clear();state.permissionDraft='';state.forms.folder=false;
    render(false);
}
function animateRegionSize(el,mutate,label) {
    if(!el){mutate();return;}
    const h=el.getBoundingClientRect().height;el.getAnimations().forEach(a=>a.cancel());el.style.height='';mutate();
    const to=el.getBoundingClientRect().height;
    if(canAnimate()&&Math.abs(to-h)>.5){el.style.overflow='hidden';const a=animateElement(el,[{height:h+'px'},{height:to+'px'}],motionTokens.layout,label);if(a)a.onfinish=()=>{el.style.height='';el.style.overflow='';};}
}
function runMarkdownStream(){return runMarkdownStreamV2();}
function replayMotion() {
    replayTimers.forEach(clearTimeout);replayTimers=[];v3Runtime.replaying=true;
    state.banner=null;state.overlay=null;state.toolsScenario='completed';
    state.detailOpen[toolKey('command','lab')]=false;state.detailOpen[toolKey('edit','lab')]=false;
    navigate('home');
    const later=(ms,fn)=>replayTimers.push(setTimeout(fn,ms));
    later(650,()=>navigate('tool-lab'));
    later(1350,()=>mutateDetails(document.querySelector('[data-tool-id="command"]'),true));
    later(1700,()=>document.querySelector('.tools-lab')?.scrollTo({top:100,behavior:canAnimate()?'smooth':'auto'}));
    later(3150,()=>mutateDetails(document.querySelector('[data-tool-id="command"]'),false));
    later(3700,()=>mutateDetails(document.querySelector('[data-tool-id="edit"]'),true));
    later(4050,()=>document.querySelector('.tools-lab')?.scrollTo({top:90,behavior:canAnimate()?'smooth':'auto'}));
    later(5600,()=>mutateDetails(document.querySelector('[data-tool-id="edit"]'),false));
    later(6100,()=>show('reasoning-quick'));
    later(7150,()=>show('reasoning'));
    later(8300,()=>close());
    later(8850,()=>{v3Runtime.replaying=false;toast('轻量工具行、原地展开与状态转场演示完成。');});
}
function handle(act) {
    const [verb,...parts]=act.split(':');const value=parts.join(':');
    if(verb==='tool-scenario'){state.toolsScenario=value;render();return;}
    if(verb==='tool-full'){
        const el=document.querySelector(`[data-tool-id="${CSS.escape(value)}"] .tool-shell,[data-tool-id="${CSS.escape(value)}"] .inline-diff`);
        animateRegionSize(el,()=>{state.toolFull[value]=!state.toolFull[value];el?.classList.toggle('is-full',state.toolFull[value]);const b=el?.querySelector('[data-action^="tool-full:"]');if(b)b.innerHTML=(state.toolFull[value]?'限制高度':'展开高度')+icon('down');},'output-height');return;
    }
    if(verb==='code-wrap'){
        const el=document.querySelector(`[data-code-id="${CSS.escape(value)}"]`);
        animateRegionSize(el,()=>{
            state.codeWrap[value]=!(state.codeWrap[value]??false);
            el?.querySelector('pre,.diff-scroll')?.classList.toggle('code-wrapped',state.codeWrap[value]);
            const button=el?.querySelector('[data-action^="code-wrap:"]');if(button){button.setAttribute('aria-pressed',String(state.codeWrap[value]));if(!button.classList.contains('icon-only'))button.innerHTML=icon('wrap')+'<span>'+(state.codeWrap[value]?'不换行':'换行')+'</span>';}
        },'code-wrap');return;
    }
    if(verb==='use-agent'){state.draftId=null;state.draft='';state.attachments=[];state.agent=value;navigate('home');return;}
    if(act==='new-chat'){
        state.draftId=null;state.draft='';state.attachments=[];state.runStopped=false;state.messageDeleted=false;state.agent='通用助手';state.effortValue=null;state.reasoning='跟随配置';
        const p=providers.find(p=>p.id===state.selectedProviderId);if(p)state.model=p.model;
        navigate('home');return;
    }
    if(act==='send'){
        if(state.screen==='running'&&!state.runStopped)return;
        if(!state.draft.trim()&&!state.attachments.length)return;
        if(state.screen==='home'&&!state.draftId){state.draftId='local-demo-'+Date.now();state.demoCreatedCount++;conversations.unshift({id:state.draftId,name:state.draft.slice(0,24)||'附件对话',description:'本轮原型中创建 · 仅演示',date:'今天',model:state.model});}
        handleV2(act);return;
    }
    if(act==='motion-toggle'){
        state.motion=!state.motion;
        if(!canAnimate())document.getAnimations().forEach(a=>{if(a.effect?.getTiming().iterations===Infinity)a.cancel();else try{a.finish();}catch{a.cancel();}});
        document.documentElement.dataset.motion=canAnimate()?'on':'off';renderReview();return;
    }
    if(act==='stop'&&state.screen==='tool-lab'){state.toolsScenario='cancelled';render();return;}
    handleV2(act);
}
/* Local label changes that don't call render, such as code copy, still get a small transition. */
const labelObserver=new MutationObserver(records=>{
    if(!canAnimate())return;
    const buttons=new Set();for(const r of records){const el=r.target.nodeType===1?r.target:r.target.parentElement;const b=el?.closest?.('[data-action^="code-copy:"]');if(b)buttons.add(b);}
    for(const b of buttons)animateElement(b,[{opacity:.3},{opacity:1}],motionTokens.state,'copy-feedback');
});
